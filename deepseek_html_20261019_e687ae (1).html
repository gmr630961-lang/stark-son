<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stark cudkadd LAWLLL · animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      overflow: hidden;
    }

    /* main container */
    .stage {
      text-align: center;
      perspective: 800px;
    }

    /* THE TEXT — main animation target */
    .mega-text {
      font-size: clamp(2.8rem, 14vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f0e9ff;
      text-shadow: 
        0 0 15px #b07eff,
        0 0 40px #7a4bff,
        0 0 80px #4a1fd0,
        0 0 140px #2a0a8a;
      display: inline-block;
      padding: 0.1em 0.2em;
      transform-style: preserve-3d;
      animation: 
        floatGlow 2.4s ease-in-out infinite alternate,
        hueRotate 6s linear infinite,
        popIn 0.9s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
      opacity: 0; /* start hidden, popIn reveals */
      white-space: nowrap;
    }

    /* subtle floating + pulsing glow */
    @keyframes floatGlow {
      0% {
        transform: translateY(0px) scale(1);
        text-shadow: 
          0 0 12px #c9a7ff,
          0 0 35px #8a5eff,
          0 0 70px #5a2ad0,
          0 0 120px #2f0a99;
      }
      100% {
        transform: translateY(-12px) scale(1.02);
        text-shadow: 
          0 0 25px #e2c9ff,
          0 0 60px #b07eff,
          0 0 110px #7a3aff,
          0 0 180px #4a1fd0;
      }
    }

    /* rotating hue for extra flair */
    @keyframes hueRotate {
      0% { filter: hue-rotate(0deg) brightness(1.1); }
      50% { filter: hue-rotate(30deg) brightness(1.3); }
      100% { filter: hue-rotate(0deg) brightness(1.1); }
    }

    /* pop-in entrance (elastic feel) */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-8deg) translateY(30px);
        filter: blur(12px);
      }
      40% {
        opacity: 1;
        transform: scale(1.1) rotate(2deg) translateY(-8px);
        filter: blur(0px);
      }
      70% {
        transform: scale(0.96) rotate(-1deg) translateY(3px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateY(0);
        filter: blur(0px);
      }
    }

    /* independent glitch flicker on a pseudo-element? let's keep it simple */
    .mega-text::before {
      content: "stark cudkadd LAWLLL";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      color: #ffb8f0;
      text-shadow: 
        -3px -2px 0 #00f7ff,
        3px 2px 0 #ff3b9e;
      opacity: 0.3;
      filter: blur(2px);
      animation: glitchShift 1.1s infinite alternate steps(2);
      z-index: -1;
      pointer-events: none;
    }

    /* relative for pseudo */
    .mega-text {
      position: relative;
    }

    @keyframes glitchShift {
      0% { transform: translate(0, 0) skewX(0deg); opacity: 0.2; }
      25% { transform: translate(-3px, 1px) skewX(2deg); opacity: 0.4; }
      50% { transform: translate(3px, -1px) skewX(-2deg); opacity: 0.3; }
      75% { transform: translate(-2px, -1px) skewX(0deg); opacity: 0.5; }
      100% { transform: translate(2px, 1px) skewX(1deg); opacity: 0.2; }
    }

    /* optional sparkle dots (just for fun) */
    .stage {
      position: relative;
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff9c4;
      border-radius: 50%;
      box-shadow: 0 0 20px #ffe066, 0 0 40px #ffb347;
      animation: sparkFloat 3s infinite alternate ease-in-out;
      opacity: 0.6;
      pointer-events: none;
    }

    .spark:nth-child(1) { top: 10%; left: 5%; animation-duration: 4.2s; }
    .spark:nth-child(2) { bottom: 15%; right: 8%; animation-duration: 3.1s; background: #a6e6ff; box-shadow: 0 0 20px #6bc8ff; }
    .spark:nth-child(3) { top: 30%; right: 15%; width: 8px; height: 8px; animation-duration: 5s; background: #ffb3d9; box-shadow: 0 0 30px #ff4d94; }
    .spark:nth-child(4) { bottom: 25%; left: 12%; width: 5px; height: 5px; animation-duration: 3.8s; background: #c084fc; box-shadow: 0 0 25px #a855f7; }

    @keyframes sparkFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      100% { transform: translateY(-40px) scale(1.4); opacity: 1; }
    }

    /* responsive behavior */
    @media (max-width: 600px) {
      .mega-text {
        white-space: normal;
        font-size: clamp(2rem, 12vw, 3.8rem);
        line-height: 1.2;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- animated sparkle dots (just for atmosphere) -->
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <!-- main text with all the animation magic -->
    <div class="mega-text">stark cudkadd LAWLLL</div>
  </div>
</body>
</html>
